{{- with .OutputFormats.Get "markdown" }}
{{- $prompt := replace (partial "t.html" "page_prompt") "{url}" .Permalink }}
<div class="page-actions" data-markdown="{{ .RelPermalink }}">
  <div class="page-actions-split">
    <button type="button" class="page-actions-copy" data-copy>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5"/></svg>
      <span class="page-actions-text">{{ partial "t.html" "copy_page" }}</span>
    </button>
    <button type="button" class="page-actions-toggle" aria-expanded="false" aria-controls="page-actions-menu" aria-label="{{ partial "t.html" "more_page_actions" }}">
      <span class="page-actions-label">{{ partial "t.html" "page_label" }}</span>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
    </button>
  </div>
  <ul class="page-actions-menu" id="page-actions-menu" hidden>
    <li><button type="button" data-copy>{{ partial "t.html" "copy_page" }}</button></li>
    <li><a href="{{ .Permalink }}" target="_blank" rel="noopener">{{ partial "t.html" "view_source" }} <span aria-hidden="true">↗</span></a></li>
    <li><a href="https://chatgpt.com/?hints=search&amp;q={{ $prompt }}" target="_blank" rel="noopener">{{ partial "t.html" "open_chatgpt" }} <span aria-hidden="true">↗</span></a></li>
    <li><a href="https://claude.ai/new?q={{ $prompt }}" target="_blank" rel="noopener">{{ partial "t.html" "open_claude" }} <span aria-hidden="true">↗</span></a></li>
  </ul>
  <span class="visually-hidden" role="status"></span>
</div>
{{- end }}
