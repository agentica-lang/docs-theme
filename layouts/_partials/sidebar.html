{{- $current := . -}}
<nav class="sidebar" id="sidebar" aria-label="{{ partial "t.html" "site_nav" }}" tabindex="-1">
  {{- partial "lang-select.html" (dict "page" . "class" "lang-select-menu") }}
  <ul>
    <li><a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ partial "t.html" "home" }}</a></li>
    {{- range site.Home.Pages.ByWeight }}
    {{ partial "sidebar-item.html" (dict "page" . "current" $current) }}
    {{- end }}
  </ul>
</nav>
