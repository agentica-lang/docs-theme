{{- $current := . -}}
<nav class="sidebar" id="sidebar" aria-label="{{ i18n "site_nav" }}" tabindex="-1">
  <ul>
    <li><a href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ i18n "home" }}</a></li>
    {{- range site.Home.Pages.ByWeight }}
    {{ partial "sidebar-item.html" (dict "page" . "current" $current) }}
    {{- end }}
  </ul>
</nav>
