name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same Hugo and Dart Sass as the agentica site (its .github/workflows/pages.yml); change them together.
    env:
      HUGO_VERSION: 0.167.0
      HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
      DART_SASS_VERSION: 1.105.1
      DART_SASS_SHA256: 9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: highlight/package-lock.json
      - name: Install Hugo and Dart Sass
        run: |
          mkdir -p "$RUNNER_TEMP/hugo" "$RUNNER_TEMP/dart-sass"
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  $RUNNER_TEMP/hugo.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          curl -fsSL -o "$RUNNER_TEMP/sass.tar.gz" "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${DART_SASS_SHA256}  $RUNNER_TEMP/sass.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sass.tar.gz" -C "$RUNNER_TEMP/dart-sass" --strip-components=1
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      # The Makefile puts DART_SASS on PATH.
      - run: make example DART_SASS="$RUNNER_TEMP/dart-sass"
